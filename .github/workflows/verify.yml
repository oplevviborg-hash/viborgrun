name: Verify Viborg 96
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run gameplay and geometry tests
        run: node --test tests/smoke.mjs
      - name: Validate game files and map data
        run: python3 scripts/validate.py
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js; do node --check "$file"; done
